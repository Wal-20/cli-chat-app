services:
  app:
    # image: waleedabdulhadi/chat-server:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_URL: ${SERVER_URL}
        JWT_SECRET: ${JWT_SECRET}
    container_name: chatapp-server
    environment:
      SERVER_URL: ${SERVER_URL}
      # Build DB_URI from parts so the host is always the `db` service on the
      # compose network, regardless of the host value in the env file.
      DB_URI: "${db_username}:${db_password}@tcp(db:${db_port})/${db_name}?parseTime=True"
      JWT_SECRET: ${JWT_SECRET}
      db_name: ${db_name}
      db_host: db
      db_port: ${db_port}
      db_username: ${db_username}
      db_password: ${db_password}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    networks:
      - chat-net

  db:
    image: mariadb:latest
    container_name: local-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${db_password}
      MARIADB_DATABASE: ${db_name}
      MARIADB_USER: ${db_username}
      MARIADB_PASSWORD: ${db_password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - chat-net

volumes:
  mariadb_data:

networks:
  chat-net:
    driver: bridge
